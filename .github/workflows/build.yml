name: Build Otto Robot Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-otto-robot:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build otto-robot and merge binary
        run: |
          # 确认脚本存在，避免"脚本没跑对"被误认为构建失败
          test -f scripts/build.py || { echo "::error::scripts/build.py not found"; exit 1; }
          python scripts/build.py otto-robot

      - name: Verify merged binary exists
        run: |
          ls -la build/ || true
          cp -v build/merged-binary.bin build/otto-robot-merged.bin

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: otto-robot-merged-firmware
          path: build/otto-robot-merged.bin
          if-no-files-found: error
