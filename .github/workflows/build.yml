问题分析

从截图看，报错信息是：

/build/scripts/build.py", line 1
    #!/usr/bin/env python3
    ^
SyntaxError: invalid syntax


第 1 行 shebang 就报语法错误，这几乎可以断定是以下原因之一：

1. 文件编码问题 — Windows 上编辑时引入了 BOM（字节顺序标记），导致 #! 前面有隐藏字符
2. 换行符问题 — Windows 的 CRLF 换行导致 shebang 解析异常
3. 文件被意外截断或损坏 — 你之前在编辑时可能误删了 #! 或引入了不可见字符

解决方法

我已经把完整的 build.py 重建好了，语法验证通过（OK）。

你需要做的：

把下载的文件覆盖回仓库的 scripts/build.py，然后提交推送。

由于文件在 Windows 上可能再次出现 CRLF 问题，建议在仓库根目录添加 .gitattributes 文件，强制 .py 文件使用 LF 换行：

*.py text eol=lf
*.sh text eol=lf


或者在 Git 中执行：
git config core.autocrlf input
git add --renormalize .


这样可以确保脚本文件在 Linux 容器中使用正确的换行符。

文件已准备好，请下载后替换仓库中的 scripts/build.py：

build.py
