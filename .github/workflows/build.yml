name: Build Otto Robot Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-otto-robot:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1

    defaults:
      run:
        shell: bash

    steps:
      - name: Trust workspace (fix dubious ownership in container)
        run: git config --global --add safe.directory '*'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: 'recursive'

      - name: Inject custom wake word "卡卡" via sdkconfig fragment
        run: |
          mkdir -p build
          cat > /tmp/custom_wake.defs <<'EOF'
          CONFIG_USE_CUSTOM_WAKE_WORD=y
          CONFIG_SR_MN_CN_MULTINET7_QUANT=y
          CONFIG_CUSTOM_WAKE_WORD="ka ka"
          CONFIG_CUSTOM_WAKE_WORD_DISPLAY="卡卡"
          CONFIG_CUSTOM_WAKE_WORD_THRESHOLD=20
          CONFIG_USE_AFE_WAKE_WORD=n
          CONFIG_USE_ESP_WAKE_WORD=n
          CONFIG_WAKE_WORD_DISABLED=n
          EOF

      - name: Build otto-robot and merge binary
        run: |
          . $IDF_PATH/export.sh
          # 让 build.py 生成的完整构建链（含 bootloader/partition-table）正常跑完
          python scripts/build.py otto-robot --language zh-CN \
            --sdkconfig-defaults-override /tmp/custom_wake.defs

      - name: Verify merged binary contains bootloader
        run: |
          python3 - <<'PY'
          import struct
          data = open('build/merged-binary.bin','rb').read()
          # bootloader 有效签名：前 2 字节应为 0xe9 (ESP_IMAGE_HEADER_MAGIC)
          magic = data[0]
          print(f"merged size: {len(data)/1024/1024:.2f} MB")
          print(f"offset 0x0 magic: 0x{magic:02x} ({'OK bootloader' if magic==0xe9 else 'MISSING bootloader!'})")
          # 分区表 MD5 在 0x8000 处附近应为 0xaa 开头
          pt_magic = data[0x8000]
          print(f"offset 0x8000 magic: 0x{pt_magic:02x} ({'OK partition-table' if pt_magic==0xaa else 'check partition table'})")
          assert magic == 0xe9, "固件缺少 bootloader，无法开机！"
          PY

      - name: Rename merged binary for easy identification
        run: |
          cp build/merged-binary.bin build/otto-robot-merged.bin

      - name: Upload merged firmware
        uses: actions/upload-artifact@v4
        with:
          name: otto-robot-merged-firmware
          path: build/otto-robot-merged.bin
          if-no-files-found: error
